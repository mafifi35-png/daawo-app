<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داوو مرضاكم بالصدقة - برويش</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0E2620; --panel:#123830; --panel-2:#17453B; --line:#1F5546;
    --gold:#E3A857; --gold-dim:#C88F45; --text:#F3EFE7; --muted:#8FBDAC; --muted-2:#5F9584;
    --danger:#D9705B; --success:#6FBF8B; --info:#6FA7D9;
    font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: radial-gradient(900px 500px at 50% -10%, #17453B70, transparent), var(--bg);
    color:var(--text); min-height:100vh; padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:460px; margin:0 auto; padding:14px 14px 30px; }
  header{ text-align:center; margin-bottom:10px; position:relative; }
  header h1{ margin:0; font-size:17.5px; font-weight:800; color:var(--gold); }
  header .brand{ margin:2px 0 0; font-size:12px; font-weight:700; color:var(--gold-dim); }
  header .who{ margin:6px 0 0; font-size:11.5px; color:var(--muted); display:flex; justify-content:center; align-items:center; gap:6px; }
  .role-badge{ background:var(--panel-2); border:1px solid var(--line); border-radius:20px; padding:2px 10px; font-size:10.5px; color:var(--gold); }
  .logout-btn{ position:absolute; left:0; top:0; background:none; border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:6px 10px; font-size:11px; font-family:inherit; }

  .tabbar{ display:flex; gap:5px; margin:12px 0 14px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px; overflow-x:auto; }
  .tab{ flex:1; text-align:center; padding:8px 2px; border-radius:9px; font-size:10.3px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .tab.active{ background:var(--gold); color:#1a1206; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:14px; }
  .card h2{ margin:0 0 10px; font-size:13.5px; font-weight:800; color:var(--gold); }

  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:15px; padding:10px 12px; font-family:inherit;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold-dim); }
  .full-btn{ width:100%; background:linear-gradient(180deg, var(--gold), var(--gold-dim)); color:#1a1206; border:none; border-radius:12px; padding:11px; font-size:14.5px; font-weight:800; cursor:pointer; font-family:inherit; }
  .full-btn:disabled{ opacity:.5; }
  .btn-flat{ flex:1; background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:9px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-danger{ background:linear-gradient(180deg,var(--danger),#b85a48); color:#fff; border:none; border-radius:10px; padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .row-actions{ display:flex; gap:8px; margin-top:10px; }
  .err{ font-size:12px; color:var(--danger); margin:4px 0; display:none; }

  .cat-filter{ display:flex; gap:6px; margin-bottom:12px; }
  .cat-filter button{ flex:1; background:var(--panel); border:1px solid var(--line); color:var(--muted); padding:8px 2px; border-radius:10px; font-size:11.5px; font-weight:700; font-family:inherit; }
  .cat-filter button.active{ background:var(--gold); color:#1a1206; border-color:var(--gold); }

  .fund-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer; }
  .fund-card .name{ font-weight:800; font-size:14.5px; }
  .fund-card .sub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .fund-card .bal{ font-weight:800; font-size:15px; color:var(--gold); white-space:nowrap; }
  .fund-card.closed{ opacity:.55; }
  .empty{ text-align:center; color:var(--muted-2); font-size:12.5px; padding:16px 0; }

  .list{ max-height:360px; overflow-y:auto; }
  .tx-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 2px; border-bottom:1px solid var(--line); }
  .tx-row:last-child{ border-bottom:none; }
  .tx-row .info{ display:flex; flex-direction:column; }
  .tx-row .who{ font-size:11.5px; color:var(--muted); }
  .tx-row .note{ font-size:11px; color:var(--muted-2); }
  .tx-row .amt{ font-weight:800; font-size:14.5px; white-space:nowrap; }
  .tx-row .amt.in{ color:var(--success); }
  .tx-row .amt.out{ color:var(--danger); }

  .back-btn{ background:none; border:none; color:var(--gold); font-size:13px; font-weight:700; cursor:pointer; margin-bottom:10px; padding:4px 0; font-family:inherit; }
  .user-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 2px; border-bottom:1px solid var(--line); }
  .user-row:last-child{ border-bottom:none; }
  .user-row .nm{ font-weight:700; font-size:13.5px; }
  .user-row .meta{ font-size:11px; color:var(--muted); }
  .pill{ font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
  .pill.admin{ color:var(--gold); border-color:var(--gold-dim); }
  .pill.supervisor{ color:var(--info); border-color:var(--info); }
  .pill.employee{ color:var(--success); border-color:var(--success); }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:18px; z-index:100; }
  .modal{ width:100%; max-width:380px; max-height:88vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .modal h3{ margin:0 0 12px; font-size:15px; color:var(--gold); }
  .hint{ font-size:11px; color:var(--muted-2); text-align:center; margin:4px 0 2px; line-height:1.6; }
  .loading{ text-align:center; padding:30px 0; color:var(--muted); font-size:13px; }
  .stat-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; }
  .stat .l{ font-size:11px; color:var(--muted); margin-bottom:4px; }
  .stat .v{ font-size:18px; font-weight:800; color:var(--gold); }
  footer{ text-align:center; font-size:10.5px; color:var(--muted-2); margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <header id="headerBox">
    <h1>داوو مرضاكم بالصدقة</h1>
    <div class="brand">برويش</div>
  </header>

  <div id="authScreen"></div>
  <div id="appScreen" style="display:none">
    <div class="tabbar" id="tabbar"></div>
    <div id="content"></div>
  </div>
  <div id="modalRoot"></div>

  <footer>بيانات كل الصناديق متزامنة أونلاين بين كل الأجهزة</footer>
</div>

<script>
"use strict";

/* ======================= إعداد السيرفر ======================= */
/* حط هنا رابط الـ Worker بتاعك بعد ما تنشره على Cloudflare */
var API_URL = "https://daawo-api.m-afifi35.workers.dev";

var token = null;
function loadToken(){ try{ return localStorage.getItem("daawo_token"); }catch(e){ return null; } }
function saveToken(t){ token = t; try{ if(t) localStorage.setItem("daawo_token", t); else localStorage.removeItem("daawo_token"); }catch(e){} }

function api(method, path, body){
  if(API_URL.indexOf("PUT_WORKER_URL_HERE")!==-1){
    return Promise.reject(Object.assign(new Error("لسه ما حطيتش رابط السيرفر في الملف (API_URL)"), {status:0}));
  }
  var headers = {"Content-Type":"application/json"};
  if(token) headers["Authorization"] = "Bearer " + token;
  return fetch(API_URL.replace(/\/+$/,"") + path, {
    method: method, headers: headers, body: body ? JSON.stringify(body) : undefined
  }).catch(function(){
    throw Object.assign(new Error("تعذر الاتصال بالسيرفر. تأكد من الإنترنت"), {status:0});
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok){
        var e = new Error(d.error || "حصل خطأ"); e.status = r.status;
        if(r.status===401 && token){ forceLogout(); }
        throw e;
      }
      return d;
    });
  });
}

function fmtNum(n){ return (Number(n)||0).toLocaleString("ar-EG"); }
function fmtTime(ts){
  if(!ts) return "";
  var d = new Date(ts);
  return d.toLocaleDateString("ar-EG",{day:"numeric",month:"short"}) + " - " + d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function showErr(id, msg){ var el = document.getElementById(id); el.textContent = msg; el.style.display = "block"; }

var CATS = [
  {key:"patient", label:"صناديق المرضى"},
  {key:"emergency", label:"تبرعات طارئة"},
  {key:"gaza", label:"غزة"}
];

/* ======================= حالة التطبيق ======================= */
var currentUser = null;      /* {uid, username, displayName, role} */
var currentTab = "funds";
var catFilter = "patient";
var openFundId = null;
var fundsCache = [];
var lastFundsJson = "";
var pollTimer = null;

/* جلب الصناديق (فيها الإجماليات). بترجع true لو في تغيير */
function refreshFunds(){
  return api("GET","/funds").then(function(d){
    var s = JSON.stringify(d.funds);
    var changed = s !== lastFundsJson;
    lastFundsJson = s;
    fundsCache = d.funds.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    return changed;
  });
}
function fundBalance(f){ return Math.round(((Number(f.i)||0)-(Number(f.o)||0))*100)/100; }

/* تحديث تلقائي كل 30 ثانية (بدل المزامنة اللحظية) */
function startPolling(){
  stopPolling();
  pollTimer = setInterval(pollTick, 30000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
function pollTick(){
  if(!currentUser || document.hidden || currentTab!=="funds") return;
  if(document.getElementById("modalRoot").innerHTML) return;
  refreshFunds().then(function(changed){
    if(!changed || currentTab!=="funds") return;
    if(openFundId) renderFundDetail(openFundId); else renderFundsList();
  }).catch(function(){});
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) pollTick(); });

/* ======================= المصادقة ======================= */
function renderAuthLoading(msg){
  document.getElementById("appScreen").style.display = "none";
  var el = document.getElementById("authScreen");
  el.style.display = "block";
  el.innerHTML = '<div class="loading">'+esc(msg||"جاري التحميل...")+'</div>';
}
function renderAuthError(msg, retry){
  document.getElementById("appScreen").style.display = "none";
  var el = document.getElementById("authScreen");
  el.style.display = "block";
  el.innerHTML = '<div class="card"><div class="empty">'+esc(msg)+'</div><button class="full-btn" id="retryBtn">إعادة المحاولة</button></div>';
  document.getElementById("retryBtn").onclick = retry;
}

function showLoggedOut(){
  renderAuthLoading("جاري التحميل...");
  api("GET","/status").then(function(d){
    if(d.setup) renderLoginScreen(); else renderSetupAdminScreen();
  }).catch(function(e){ renderAuthError(e.message, showLoggedOut); });
}

function renderSetupAdminScreen(){
  document.getElementById("appScreen").style.display = "none";
  var el = document.getElementById("authScreen");
  el.style.display = "block";
  el.innerHTML =
    '<div class="card"><h2>إعداد حساب المدير (أول مرة)</h2>'+
    '<p class="hint">حساب المدير بيتعمل مرة واحدة بس، وبعده مفيش حد يقدر يسجل كمدير. المشرفين والعاملين بيتضافوا من المدير جوه البرنامج.</p>'+
    '<div class="field"><label>كود الإعداد (السري)</label><input id="su_code" type="password" autocomplete="off"></div>'+
    '<div class="field"><label>اسم المدير</label><input id="su_name" placeholder="مثلاً: محمود أفيفي"></div>'+
    '<div class="field"><label>اسم المستخدم (دخول)</label><input id="su_user" autocomplete="off" placeholder="مثلاً: admin"></div>'+
    '<div class="field"><label>كلمة السر</label><input id="su_pass" type="password" placeholder="6 حروف/أرقام على الأقل"></div>'+
    '<div class="err" id="su_err"></div>'+
    '<button class="full-btn" id="su_btn">إنشاء حساب المدير والدخول</button></div>';

  document.getElementById("su_btn").onclick = function(){
    var code = document.getElementById("su_code").value;
    var name = document.getElementById("su_name").value.trim();
    var user = document.getElementById("su_user").value.trim();
    var pass = document.getElementById("su_pass").value;
    document.getElementById("su_err").style.display="none";
    if(!code||!name||!user||!pass){ showErr("su_err","لازم تملى كل الحقول"); return; }
    if(pass.length<6){ showErr("su_err","كلمة السر لازم تكون 6 حروف/أرقام على الأقل"); return; }
    renderAuthLoading("جاري إنشاء حساب المدير...");
    api("POST","/setup",{code:code, name:name, username:user, password:pass}).then(function(d){
      saveToken(d.token);
      startSession(d.user);
    }).catch(function(e){
      renderSetupAdminScreen();
      showErr("su_err","خطأ: " + e.message);
    });
  };
}

function renderLoginScreen(){
  document.getElementById("appScreen").style.display = "none";
  var el = document.getElementById("authScreen");
  el.style.display = "block";
  el.innerHTML =
    '<div class="card"><h2>تسجيل الدخول</h2>'+
    '<div class="field"><label>اسم المستخدم</label><input id="li_user" autocomplete="off"></div>'+
    '<div class="field"><label>كلمة السر</label><input id="li_pass" type="password"></div>'+
    '<div class="err" id="li_err"></div>'+
    '<button class="full-btn" id="li_btn">دخول</button>'+
    '<p class="hint"><a href="#" id="recoverLink" style="color:var(--muted)">نسيت كلمة سر المدير / عايز أغيّر المدير</a></p></div>';
  document.getElementById("recoverLink").onclick = function(e){ e.preventDefault(); renderRecoverScreen(); };
  document.getElementById("li_btn").onclick = function(){
    var user = document.getElementById("li_user").value.trim();
    var pass = document.getElementById("li_pass").value;
    document.getElementById("li_err").style.display="none";
    if(!user||!pass){ showErr("li_err","اكتب اسم المستخدم وكلمة السر"); return; }
    renderAuthLoading("جاري الدخول...");
    api("POST","/login",{username:user, password:pass}).then(function(d){
      saveToken(d.token);
      startSession(d.user);
    }).catch(function(e){
      renderLoginScreen();
      showErr("li_err", e.message);
    });
  };
}

function renderRecoverScreen(){
  document.getElementById("appScreen").style.display = "none";
  var el = document.getElementById("authScreen");
  el.style.display = "block";
  el.innerHTML =
    '<div class="card"><h2>تغيير / استرجاع حساب المدير</h2>'+
    '<p class="hint">محتاج كود الإعداد السري. كل البيانات (الصناديق والتبرعات والعاملين) بتفضل زي ما هي، والمدير الحالي بيتطلّع من كل الأجهزة.</p>'+
    '<div class="field"><label>كود الإعداد (السري)</label><input id="rc_code" type="password" autocomplete="off"></div>'+
    '<div class="field"><label>اسم المدير الجديد</label><input id="rc_name"></div>'+
    '<div class="field"><label>اسم المستخدم (دخول)</label><input id="rc_user" autocomplete="off"></div>'+
    '<div class="field"><label>كلمة السر الجديدة</label><input id="rc_pass" type="password" placeholder="6 حروف/أرقام على الأقل"></div>'+
    '<div class="err" id="rc_err"></div>'+
    '<button class="full-btn" id="rc_btn">حفظ والدخول</button>'+
    '<div class="row-actions"><button class="btn-flat" id="rc_back">رجوع</button></div></div>';
  document.getElementById("rc_back").onclick = renderLoginScreen;
  document.getElementById("rc_btn").onclick = function(){
    var code = document.getElementById("rc_code").value;
    var name = document.getElementById("rc_name").value.trim();
    var user = document.getElementById("rc_user").value.trim();
    var pass = document.getElementById("rc_pass").value;
    document.getElementById("rc_err").style.display="none";
    if(!code||!name||!user||!pass){ showErr("rc_err","لازم تملى كل الحقول"); return; }
    if(pass.length<6){ showErr("rc_err","كلمة السر لازم تكون 6 حروف/أرقام على الأقل"); return; }
    renderAuthLoading("جاري الحفظ...");
    api("POST","/recover",{code:code, name:name, username:user, password:pass}).then(function(d){
      saveToken(d.token);
      startSession(d.user);
    }).catch(function(e){
      renderRecoverScreen();
      showErr("rc_err", e.message);
    });
  };
}

function startSession(u){
  currentUser = { uid:u.username, username:u.username, displayName:u.displayName, role:u.role };
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("appScreen").style.display = "block";
  currentTab = "funds"; openFundId = null; lastFundsJson = "";
  renderHeader();
  renderTabs();
  switchTab("funds");
  startPolling();
}

function boot(){
  token = loadToken();
  if(!token){ showLoggedOut(); return; }
  renderAuthLoading("جاري تحميل بياناتك...");
  api("GET","/me").then(function(d){ startSession(d.user); }).catch(function(e){
    if(e.status===401){ return; } /* forceLogout بيعرض شاشة الدخول */
    renderAuthError(e.message, boot);
  });
}

function forceLogout(){
  saveToken(null);
  currentUser = null;
  stopPolling();
  document.getElementById("modalRoot").innerHTML = "";
  document.getElementById("headerBox").innerHTML = '<h1>داوو مرضاكم بالصدقة</h1><div class="brand">برويش</div>';
  showLoggedOut();
}

function renderHeader(){
  var roleLabel = {admin:"مدير", supervisor:"مشرف", employee:"عامل"}[currentUser.role] || "";
  document.getElementById("headerBox").innerHTML =
    '<button class="logout-btn" id="logoutBtn">خروج</button>'+
    '<h1>داوو مرضاكم بالصدقة</h1><div class="brand">برويش</div>'+
    '<div class="who">'+esc(currentUser.displayName)+' <span class="role-badge">'+roleLabel+'</span></div>';
  document.getElementById("logoutBtn").onclick = forceLogout;
}

/* ======================= التنقل بين التابات ======================= */
function renderTabs(){
  var tabs = [{key:"funds", label:"الصناديق"}];
  if(currentUser.role==="admin" || currentUser.role==="supervisor"){
    tabs.push({key:"reports", label:"التقارير"});
  }
  if(currentUser.role==="admin"){
    tabs.push({key:"users", label:"العاملين"});
  }
  var bar = document.getElementById("tabbar");
  bar.innerHTML = tabs.map(function(t){
    return '<div class="tab'+(t.key===currentTab?' active':'')+'" data-tab="'+t.key+'">'+t.label+'</div>';
  }).join("");
  Array.prototype.forEach.call(bar.querySelectorAll(".tab"), function(el){
    el.onclick = function(){ switchTab(el.getAttribute("data-tab")); };
  });
}
function switchTab(key){
  currentTab = key; openFundId = null;
  renderTabs();
  if(key==="funds"){
    document.getElementById("content").innerHTML = '<div class="loading">جاري التحميل...</div>';
    refreshFunds().then(function(){ if(currentTab==="funds") renderFundsList(); })
      .catch(function(e){ document.getElementById("content").innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
  }
  else if(key==="reports") renderReports();
  else if(key==="users") renderUsersScreen();
}

/* ======================= الصناديق ======================= */
function renderFundsList(){
  var c = document.getElementById("content");
  var canManage = currentUser.role==="admin" || currentUser.role==="supervisor";
  var filtered = fundsCache.filter(function(f){ return f.category===catFilter; });

  var html = '<div class="cat-filter">'+CATS.map(function(cat){
    return '<button class="'+(cat.key===catFilter?'active':'')+'" data-cat="'+cat.key+'">'+cat.label+'</button>';
  }).join('')+'</div>';

  if(canManage && catFilter!=="gaza"){
    html += '<button class="full-btn" id="addFundBtn" style="margin-bottom:12px">+ إضافة صندوق جديد</button>';
  }

  if(!filtered.length){
    html += '<div class="empty">لا توجد صناديق في هذا القسم بعد</div>';
  } else {
    filtered.forEach(function(f){
      html += '<div class="fund-card'+(f.status==="closed"?' closed':'')+'" data-id="'+esc(f.id)+'">'+
        '<div><div class="name">'+esc(f.name)+(f.status==="closed"?' (مغلق)':'')+'</div>'+
        (f.subcategory?'<div class="sub">'+esc(f.subcategory)+'</div>':'')+'</div>'+
        '<div class="bal">'+fmtNum(fundBalance(f))+' ج</div></div>';
    });
  }
  c.innerHTML = html;

  Array.prototype.forEach.call(c.querySelectorAll(".cat-filter button"), function(b){
    b.onclick = function(){ catFilter = b.getAttribute("data-cat"); renderFundsList(); };
  });
  var addBtn = document.getElementById("addFundBtn");
  if(addBtn) addBtn.onclick = openAddFundModal;

  Array.prototype.forEach.call(c.querySelectorAll(".fund-card"), function(card){
    var id = card.getAttribute("data-id");
    card.onclick = function(){ openFundId = id; renderFundDetail(id); };
  });
}

function afterChange(){
  return refreshFunds().then(function(){
    if(currentTab!=="funds") return;
    if(openFundId) renderFundDetail(openFundId); else renderFundsList();
  });
}

function openAddFundModal(){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>إضافة صندوق جديد</h3>'+
    '<div class="field"><label>اسم الصندوق</label><input id="nf_name" placeholder="مثلاً: اسم المريض أو الحالة"></div>'+
    '<div class="err" id="nf_err"></div>'+
    '<div class="row-actions"><button class="btn-flat" id="nf_cancel">إلغاء</button>'+
    '<button class="full-btn" id="nf_save">حفظ</button></div></div></div>';
  document.getElementById("nf_cancel").onclick = function(){ root.innerHTML=""; };
  document.getElementById("nf_save").onclick = function(){
    var name = document.getElementById("nf_name").value.trim();
    if(!name){ showErr("nf_err","اكتب اسم الصندوق"); return; }
    var btn = document.getElementById("nf_save"); btn.disabled = true;
    api("POST","/funds",{name:name, category:catFilter}).then(function(){
      root.innerHTML=""; return afterChange();
    }).catch(function(e){ btn.disabled = false; showErr("nf_err", e.message); });
  };
}

function openEditFundModal(fund){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>تعديل الصندوق</h3>'+
    '<div class="field"><label>اسم الصندوق</label><input id="ef_name" value="'+esc(fund.name)+'"></div>'+
    '<div class="err" id="ef_err"></div>'+
    '<div class="row-actions">'+
    '<button class="btn-flat" id="ef_cancel">إلغاء</button>'+
    '<button class="full-btn" id="ef_save">حفظ</button></div>'+
    '<div class="row-actions" style="margin-top:8px">'+
    '<button class="btn-danger" id="ef_toggle" style="flex:1">'+(fund.status==="closed"?"إعادة فتح الصندوق":"إغلاق الصندوق")+'</button>'+
    '</div></div></div>';
  function done(p){ p.then(function(){ root.innerHTML=""; return afterChange(); }).catch(function(e){ showErr("ef_err", e.message); }); }
  document.getElementById("ef_cancel").onclick = function(){ root.innerHTML=""; };
  document.getElementById("ef_save").onclick = function(){
    var name = document.getElementById("ef_name").value.trim();
    if(!name) return;
    done(api("PATCH","/funds/"+fund.id,{name:name}));
  };
  document.getElementById("ef_toggle").onclick = function(){
    done(api("PATCH","/funds/"+fund.id,{status: fund.status==="closed"?"open":"closed"}));
  };
}

function renderFundDetail(fundId){
  var fund = fundsCache.find(function(f){ return f.id===fundId; });
  var c = document.getElementById("content");
  if(!fund){ c.innerHTML = '<div class="empty">الصندوق غير موجود</div>'; return; }
  var canManage = currentUser.role==="admin" || currentUser.role==="supervisor";

  var html = '<button class="back-btn" id="backBtn">‹ رجوع للصناديق</button>';
  html += '<div class="card"><h2>'+esc(fund.name)+' '+(canManage?'<span id="editFundIcon" style="float:left;cursor:pointer;color:var(--muted);font-size:12px">✎ تعديل</span>':'')+'</h2>';
  html += '<div class="stat-row"><div class="stat"><div class="l">الرصيد الحالي</div><div class="v">'+fmtNum(fundBalance(fund))+' ج</div></div>';
  html += '<div class="stat"><div class="l">إجمالي التبرعات</div><div class="v">'+fmtNum(fund.i)+' ج</div></div></div>';
  html += '<button class="full-btn" id="addDonationBtn">+ تسجيل تبرع</button>';
  if(canManage) html += '<button class="btn-flat" id="addExpenseBtn" style="width:100%;margin-top:8px">+ تسجيل مصروف</button>';
  html += '</div>';
  html += '<div class="card"><h2>سجل الحركات</h2><div class="list" id="txList"><div class="loading">جاري التحميل...</div></div></div>';
  c.innerHTML = html;

  document.getElementById("backBtn").onclick = function(){ openFundId=null; renderFundsList(); };
  var editIcon = document.getElementById("editFundIcon");
  if(editIcon) editIcon.onclick = function(){ openEditFundModal(fund); };
  document.getElementById("addDonationBtn").onclick = function(){ openTxModal(fund, "donation"); };
  var expBtn = document.getElementById("addExpenseBtn");
  if(expBtn) expBtn.onclick = function(){ openTxModal(fund, "expense"); };

  api("GET","/funds/"+fundId+"/tx").then(function(res){
    var list = document.getElementById("txList");
    if(!list || openFundId!==fundId) return;
    var txs = res.tx;
    if(!txs.length){ list.innerHTML='<div class="empty">لا توجد حركات بعد</div>'; return; }
    list.innerHTML = txs.map(function(t){
      return '<div class="tx-row"><div class="info"><div class="who">'+esc(t.who||"")+'</div>'+
        (t.note?'<div class="note">'+esc(t.note)+'</div>':'')+'</div>'+
        '<div><div class="amt '+(t.t==="in"?"in":"out")+'">'+(t.t==="in"?"+":"-")+fmtNum(t.amount)+'</div>'+
        '<div class="note">'+fmtTime(t.ts)+'</div></div></div>';
    }).join("");
  }).catch(function(e){
    var list = document.getElementById("txList");
    if(list) list.innerHTML = '<div class="empty">'+esc(e.message)+'</div>';
  });
}

function openTxModal(fund, kind){
  var root = document.getElementById("modalRoot");
  var title = kind==="donation" ? "تسجيل تبرع - "+esc(fund.name) : "تسجيل مصروف - "+esc(fund.name);
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>'+title+'</h3>'+
    '<div class="field"><label>المبلغ</label><input id="tx_amt" type="number" inputmode="decimal"></div>'+
    (kind==="donation" ? '<div class="field"><label>اسم المتبرع (اختياري)</label><input id="tx_note"></div>' :
      '<div class="field"><label>بيان المصروف</label><input id="tx_note"></div>')+
    '<div class="err" id="tx_err"></div>'+
    '<div class="row-actions"><button class="btn-flat" id="tx_cancel">إلغاء</button>'+
    '<button class="full-btn" id="tx_save">حفظ</button></div></div></div>';
  document.getElementById("tx_cancel").onclick = function(){ root.innerHTML=""; };
  document.getElementById("tx_save").onclick = function(){
    var amt = Number(document.getElementById("tx_amt").value);
    var note = document.getElementById("tx_note").value.trim();
    document.getElementById("tx_err").style.display = "none";
    if(!amt || amt<=0){ showErr("tx_err","اكتب مبلغ صحيح"); return; }
    var btn = document.getElementById("tx_save"); btn.disabled = true;
    api("POST","/funds/"+fund.id+"/tx",{kind:kind, amount:amt, note:note}).then(function(){
      root.innerHTML="";
      return afterChange();
    }).catch(function(e){ btn.disabled = false; showErr("tx_err", e.message); });
  };
}

/* ======================= التقارير ======================= */
function renderReports(){
  var c = document.getElementById("content");
  c.innerHTML = '<div class="loading">جاري تجهيز التقرير...</div>';
  refreshFunds().then(function(){
    if(currentTab!=="reports") return;
    var byEmployee = {}, totalDonations = 0, totalExpenses = 0;
    fundsCache.forEach(function(f){
      totalDonations += Number(f.i)||0;
      totalExpenses += Number(f.o)||0;
      var emp = f.emp || {};
      Object.keys(emp).forEach(function(n){ byEmployee[n] = (byEmployee[n]||0) + (Number(emp[n])||0); });
    });

    var html = '<div class="card"><h2>الإجمالي العام</h2><div class="stat-row">'+
      '<div class="stat"><div class="l">إجمالي التبرعات</div><div class="v">'+fmtNum(totalDonations)+'</div></div>'+
      '<div class="stat"><div class="l">إجمالي المصروفات</div><div class="v">'+fmtNum(totalExpenses)+'</div></div></div></div>';

    html += '<div class="card"><h2>أداء العاملين (مبلغ ما تم تحصيله)</h2>';
    var emps = Object.keys(byEmployee).sort(function(a,b){ return byEmployee[b]-byEmployee[a]; });
    if(!emps.length) html += '<div class="empty">لا توجد تبرعات مسجلة بعد</div>';
    else html += emps.map(function(e){
      return '<div class="tx-row"><div class="who">'+esc(e)+'</div><div class="amt in">'+fmtNum(byEmployee[e])+' ج</div></div>';
    }).join("");
    html += '</div>';

    html += '<div class="card"><h2>تفصيل حسب الصندوق</h2>';
    var fundRows = fundsCache.filter(function(f){ return f.i; });
    if(!fundRows.length) html += '<div class="empty">لا توجد بيانات بعد</div>';
    else html += fundRows.map(function(f){
      return '<div class="tx-row"><div class="who">'+esc(f.name)+'</div><div class="amt in">'+fmtNum(f.i)+' ج</div></div>';
    }).join("");
    html += '</div>';

    c.innerHTML = html;
  }).catch(function(e){ c.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
}

/* ======================= إدارة العاملين ======================= */
function renderUsersScreen(){
  var c = document.getElementById("content");
  c.innerHTML = '<button class="full-btn" id="addUserBtn" style="margin-bottom:12px">+ إضافة مشرف / عامل جديد</button>'+
    '<div class="card"><h2>كل العاملين على البرنامج</h2><div id="usersList" class="loading">جاري التحميل...</div></div>';
  document.getElementById("addUserBtn").onclick = openAddUserModal;

  api("GET","/users").then(function(d){
    var list = document.getElementById("usersList");
    if(!list) return;
    var rows = d.users;
    if(!rows.length){ list.className=""; list.innerHTML='<div class="empty">لا يوجد مستخدمين</div>'; return; }
    list.className = "";
    list.innerHTML = rows.map(function(u){
      var roleLabel = {admin:"مدير",supervisor:"مشرف",employee:"عامل"}[u.role]||u.role;
      return '<div class="user-row"><div><div class="nm">'+esc(u.displayName)+'</div>'+
        '<div class="meta">@'+esc(u.username)+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:8px">'+
        '<span class="pill '+esc(u.role)+'">'+roleLabel+'</span>'+
        (u.role!=="admin" ? '<button class="btn-flat" data-toggle="'+esc(u.username)+'" data-active="'+u.active+'" style="padding:5px 9px;font-size:11px">'+(u.active?'إيقاف':'تفعيل')+'</button>' : '')+
        '</div></div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll("[data-toggle]"), function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-toggle");
        var active = btn.getAttribute("data-active")==="true";
        btn.disabled = true;
        api("PATCH","/users/"+encodeURIComponent(id),{active: !active}).then(function(){ renderUsersScreen(); })
          .catch(function(e){ btn.disabled = false; alert(e.message); });
      };
    });
  }).catch(function(e){
    var list = document.getElementById("usersList");
    if(list){ list.className=""; list.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
  });
}

function openAddUserModal(){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="overlay"><div class="modal"><h3>إضافة مشرف / عامل</h3>'+
    '<div class="field"><label>الاسم الكامل</label><input id="au_name"></div>'+
    '<div class="field"><label>اسم المستخدم (دخول)</label><input id="au_user" autocomplete="off"></div>'+
    '<div class="field"><label>كلمة السر</label><input id="au_pass" type="password"></div>'+
    '<div class="field"><label>الدور</label><select id="au_role"><option value="employee">عامل (تحصيل تبرعات)</option><option value="supervisor">مشرف (إدارة الصناديق)</option></select></div>'+
    '<div class="err" id="au_err"></div>'+
    '<div class="row-actions"><button class="btn-flat" id="au_cancel">إلغاء</button>'+
    '<button class="full-btn" id="au_save">إضافة</button></div></div></div>';
  document.getElementById("au_cancel").onclick = function(){ root.innerHTML=""; };
  document.getElementById("au_save").onclick = function(){
    var name = document.getElementById("au_name").value.trim();
    var user = document.getElementById("au_user").value.trim();
    var pass = document.getElementById("au_pass").value;
    var role = document.getElementById("au_role").value;
    document.getElementById("au_err").style.display="none";
    if(!name||!user||!pass){ showErr("au_err","لازم تملى كل الحقول"); return; }
    if(pass.length<6){ showErr("au_err","كلمة السر 6 حروف/أرقام على الأقل"); return; }
    var btn = document.getElementById("au_save"); btn.disabled = true;
    api("POST","/users",{name:name, username:user, password:pass, role:role}).then(function(){
      root.innerHTML="";
      renderUsersScreen();
    }).catch(function(e){ btn.disabled = false; showErr("au_err","خطأ: " + e.message); });
  };
}

boot();
</script>
